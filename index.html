<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Message Revealer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 6px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .revealed-text {
            background: white;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-text {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Secret Message</h1>
        
        <div class="input-group">
            <label for="password">Enter Password:</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter the secret password..."
            >
        </div>

        <button onclick="revealMessage()">Reveal Message</button>

        <div id="message" class="message">
            <div id="messageText"></div>
        </div>

        <p class="info-text">Only those who know the password can see the secret message.</p>
    </div>

    <script>
        // ========== CUSTOMIZE THESE SETTINGS ==========
        
        // Add your password(s) and corresponding messages here
        const secrets = {
            "password123": "🎉 Congratulations! You found the first secret!",
            "hello": "👋 Welcome! This is your hidden message.",
            "mysecret": "🌟 You're awesome for figuring this out!"
        };

        // List of redeemed codes (you can track these yourself)
        const redeemedCodes = [];

        // ========== END CUSTOMIZATION ==========

        function revealMessage() {
            const passwordInput = document.getElementById('password');
            const messageDiv = document.getElementById('message');
            const messageText = document.getElementById('messageText');
            const password = passwordInput.value.trim();

            if (!password) {
                showError(messageDiv, messageText, 'Please enter a password.');
                return;
            }

            if (secrets[password]) {
                // Log redemption (visible in browser console for your records)
                console.log(`✓ Redeemed at: ${new Date().toISOString()}`);
                
                showSuccess(messageDiv, messageText, secrets[password]);
                redeemedCodes.push({
                    password: password,
                    timestamp: new Date().toISOString()
                });
                
                // Clear the input
                passwordInput.value = '';
            } else {
                showError(messageDiv, messageText, '❌ Incorrect password. Try again!');
                passwordInput.value = '';
            }
        }

        function showSuccess(messageDiv, messageText, text) {
            messageDiv.className = 'message show success';
            messageText.innerHTML = `
                <strong>✓ Success!</strong>
                <div class="revealed-text">${text}</div>
            `;
        }

        function showError(messageDiv, messageText, text) {
            messageDiv.className = 'message show error';
            messageText.textContent = text;
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                revealMessage();
            }
        });

        // Log redemption history to console (only visible to you in dev tools)
        console.log('=== REDEMPTION TRACKER ===');
        console.log('Check console.log(redeemedCodes) to see all redeemed passwords');
    </script>
</body>
</html>
